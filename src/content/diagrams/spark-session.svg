  <rect class="d-box-accent" x="212" y="52" width="340" height="212" rx="8" />
  <text class="d-title" x="382" y="78" text-anchor="middle">spark · SparkSession</text>
  <text class="d-code-small" x="382" y="98" text-anchor="middle">SparkSession.builder…getOrCreate()</text>

  <!-- four doors -->
  <rect class="d-box" x="228" y="114" width="150" height="34" rx="6" />
  <text class="d-code-small" x="303" y="129" text-anchor="middle">spark.read</text>
  <text class="d-muted" x="303" y="143" text-anchor="middle">leer archivos</text>

  <rect class="d-box" x="386" y="114" width="150" height="34" rx="6" />
  <text class="d-code-small" x="461" y="129" text-anchor="middle">spark.createDataFrame</text>
  <text class="d-muted" x="461" y="143" text-anchor="middle">datos de Python</text>

  <rect class="d-box" x="228" y="156" width="150" height="34" rx="6" />
  <text class="d-code-small" x="303" y="171" text-anchor="middle">spark.sql</text>
  <text class="d-muted" x="303" y="185" text-anchor="middle">consultas SQL</text>

  <rect class="d-box" x="386" y="156" width="150" height="34" rx="6" />
  <text class="d-code-small" x="461" y="171" text-anchor="middle">spark.conf</text>
  <text class="d-muted" x="461" y="185" text-anchor="middle">configuración</text>

  <rect class="d-box-ghost" x="228" y="204" width="308" height="44" rx="6" />
  <text class="d-code-small" x="382" y="222" text-anchor="middle">spark.sparkContext</text>
  <text class="d-muted" x="382" y="238" text-anchor="middle">master · appName · defaultParallelism</text>

  <!-- Executors -->
  <path class="d-line-accent" d="M570 110H616" marker-end="url(#ss-arrow)" />
  <path class="d-line-accent" d="M570 150H616" marker-end="url(#ss-arrow)" />
  <path class="d-line-accent" d="M570 190H616" marker-end="url(#ss-arrow)" />
  <text class="d-muted" x="593" y="90" text-anchor="middle">tasks</text>

  <rect class="d-box-success" x="618" y="92" width="166" height="36" rx="6" />
  <text class="d-text" x="701" y="115" text-anchor="middle">Executor 1</text>
  <rect class="d-box-success" x="618" y="132" width="166" height="36" rx="6" />
  <text class="d-text" x="701" y="155" text-anchor="middle">Executor 2</text>
  <rect class="d-box-success" x="618" y="172" width="166" height="36" rx="6" />
  <text class="d-text" x="701" y="195" text-anchor="middle">Executor 3</text>
  <text class="d-muted" x="701" y="232" text-anchor="middle">en modo local: el mismo</text>
