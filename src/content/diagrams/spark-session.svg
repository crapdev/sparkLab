<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0L10 5L0 10z" />
    </marker>
    <marker id="ss-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <!-- Your code -->
  <rect class="d-box" x="16" y="104" width="130" height="92" rx="8" />
  <text class="d-title" x="81" y="138" text-anchor="middle">Tu código</text>
  <text class="d-muted" x="81" y="158" text-anchor="middle">notebook o script</text>
  <text class="d-code-small" x="81" y="180" text-anchor="middle">spark.read…</text>

  <path class="d-line-accent" d="M146 150H192" marker-end="url(#ss-arrow)" />

  <!-- Driver with the session inside -->
  <rect class="d-box-ghost" x="194" y="20" width="376" height="262" rx="10" />
