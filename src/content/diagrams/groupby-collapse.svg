<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 290">
  <defs>
    <marker id="gb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <!-- Source rows -->
  <text class="d-title" x="16" y="24">Filas sueltas</text>
  <rect class="d-box" x="16" y="40" width="130" height="24" rx="3" />
  <rect class="d-box" x="146" y="40" width="80" height="24" rx="3" />
  <text class="d-muted" x="81" y="57" text-anchor="middle">Item_Type</text>
  <text class="d-muted" x="186" y="57" text-anchor="middle">Item_MRP</text>

  <rect class="d-box-accent" x="16" y="64" width="130" height="24" />
  <rect class="d-box-accent" x="146" y="64" width="80" height="24" />
  <text class="d-text" x="81" y="81" text-anchor="middle">Snack Foods</text>
  <text class="d-text" x="186" y="81" text-anchor="middle">57.0</text>

  <rect class="d-box-info" x="16" y="88" width="130" height="24" />
  <rect class="d-box-info" x="146" y="88" width="80" height="24" />
  <text class="d-text" x="81" y="105" text-anchor="middle">Dairy</text>
  <text class="d-text" x="186" y="105" text-anchor="middle">249.8</text>

  <rect class="d-box-accent" x="16" y="112" width="130" height="24" />
  <rect class="d-box-accent" x="146" y="112" width="80" height="24" />
  <text class="d-text" x="81" y="129" text-anchor="middle">Snack Foods</text>
  <text class="d-text" x="186" y="129" text-anchor="middle">107.0</text>

  <rect class="d-box-info" x="16" y="136" width="130" height="24" />
  <rect class="d-box-info" x="146" y="136" width="80" height="24" />
  <text class="d-text" x="81" y="153" text-anchor="middle">Dairy</text>
  <text class="d-text" x="186" y="153" text-anchor="middle">50.2</text>

  <rect class="d-box-accent" x="16" y="160" width="130" height="24" />
  <rect class="d-box-accent" x="146" y="160" width="80" height="24" />
  <text class="d-text" x="81" y="177" text-anchor="middle">Snack Foods</text>
  <text class="d-text" x="186" y="177" text-anchor="middle">36.0</text>

  <!-- Arrow with code -->
  <path class="d-line-accent" d="M236 112H420" marker-end="url(#gb-arrow)" />
  <text class="d-code-small" x="328" y="100" text-anchor="middle">.groupBy("Item_Type")</text>
  <text class="d-code-small" x="328" y="134" text-anchor="middle">.agg(F.sum("Item_MRP"))</text>

  <!-- Groups -->
  <text class="d-title" x="430" y="24">Un grupo por valor</text>
  <rect class="d-box-ghost" x="430" y="40" width="190" height="60" rx="6" />
  <text class="d-accent-text" x="442" y="60">Snack Foods</text>
  <text class="d-muted" x="442" y="80">57.0 + 107.0 + 36.0</text>
  <rect class="d-box-ghost" x="430" y="112" width="190" height="60" rx="6" />
  <text class="d-accent-text" x="442" y="132">Dairy</text>
  <text class="d-muted" x="442" y="152">249.8 + 50.2</text>

  <!-- Arrow -->
  <path class="d-line-accent" d="M630 106H664" marker-end="url(#gb-arrow)" />

  <!-- Result -->
  <text class="d-title" x="674" y="24">Una fila por grupo</text>
  <rect class="d-box" x="674" y="40" width="80" height="24" rx="3" />
  <rect class="d-box" x="754" y="40" width="64" height="24" rx="3" />
  <text class="d-muted" x="714" y="57" text-anchor="middle">Item_Type</text>
  <text class="d-muted" x="786" y="57" text-anchor="middle">sum</text>
  <rect class="d-box-success" x="674" y="64" width="80" height="24" />
  <rect class="d-box-success" x="754" y="64" width="64" height="24" />
  <text class="d-text" x="714" y="81" text-anchor="middle">Snack Foods</text>
  <text class="d-text" x="786" y="81" text-anchor="middle">200.0</text>
  <rect class="d-box-success" x="674" y="88" width="80" height="24" />
  <rect class="d-box-success" x="754" y="88" width="64" height="24" />
  <text class="d-text" x="714" y="105" text-anchor="middle">Dairy</text>
  <text class="d-text" x="786" y="105" text-anchor="middle">300.0</text>

  <!-- Footer -->
  <rect class="d-box-info" x="16" y="212" width="802" height="62" rx="8" />
  <text class="d-text" x="32" y="236">Las columnas que no están en el groupBy desaparecen, salvo que las agregues.</text>
  <text class="d-muted" x="32" y="258">En BigMart: 8523 filas → 16 grupos por Item_Type; la suma de los 16 totales vuelve a dar el total general, 1 201 681.48.</text>
</svg>
