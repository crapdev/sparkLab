<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300">
  <defs>
    <marker id="un-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <!-- emp -->
  <text class="d-title" x="16" y="24">emp</text>
  <rect class="d-box" x="16" y="34" width="54" height="22" rx="3" />
  <rect class="d-box" x="70" y="34" width="62" height="22" rx="3" />
  <rect class="d-box" x="132" y="34" width="62" height="22" rx="3" />
  <text class="d-muted" x="43" y="49" text-anchor="middle">emp_id</text>
  <text class="d-muted" x="101" y="49" text-anchor="middle">name</text>
  <text class="d-muted" x="163" y="49" text-anchor="middle">dept_id</text>
  <rect class="d-box-success" x="16" y="56" width="54" height="20" />
  <rect class="d-box-success" x="70" y="56" width="62" height="20" />
  <rect class="d-box-success" x="132" y="56" width="62" height="20" />
  <text class="d-text" x="43" y="70" text-anchor="middle">1</text>
  <text class="d-text" x="101" y="70" text-anchor="middle">Ana</text>
  <text class="d-text" x="163" y="70" text-anchor="middle">d01</text>
  <rect class="d-box-success" x="16" y="76" width="54" height="20" />
  <rect class="d-box-success" x="70" y="76" width="62" height="20" />
  <rect class="d-box-success" x="132" y="76" width="62" height="20" />
  <text class="d-text" x="43" y="90" text-anchor="middle">2</text>
  <text class="d-text" x="101" y="90" text-anchor="middle">Luis</text>
  <text class="d-text" x="163" y="90" text-anchor="middle">d02</text>
  <text class="d-muted" x="105" y="112" text-anchor="middle">… 6 filas</text>

  <!-- new_hires, columns in another order -->
  <text class="d-title" x="232" y="24">new_hires (otro orden de columnas)</text>
  <rect class="d-box" x="232" y="34" width="54" height="22" rx="3" />
  <rect class="d-box-accent" x="286" y="34" width="62" height="22" rx="3" />
  <rect class="d-box-accent" x="348" y="34" width="62" height="22" rx="3" />
  <text class="d-muted" x="259" y="49" text-anchor="middle">emp_id</text>
  <text class="d-muted" x="317" y="49" text-anchor="middle">dept_id</text>
  <text class="d-muted" x="379" y="49" text-anchor="middle">name</text>
  <rect class="d-box" x="232" y="56" width="54" height="20" />
  <rect class="d-box-accent" x="286" y="56" width="62" height="20" />
  <rect class="d-box-accent" x="348" y="56" width="62" height="20" />
  <text class="d-text" x="259" y="70" text-anchor="middle">7</text>
  <text class="d-text" x="317" y="70" text-anchor="middle">d02</text>
  <text class="d-text" x="379" y="70" text-anchor="middle">Elena</text>
  <rect class="d-box" x="232" y="76" width="54" height="20" />
  <rect class="d-box-accent" x="286" y="76" width="62" height="20" />
  <rect class="d-box-accent" x="348" y="76" width="62" height="20" />
  <text class="d-text" x="259" y="90" text-anchor="middle">8</text>
  <text class="d-text" x="317" y="90" text-anchor="middle">d04</text>
  <text class="d-text" x="379" y="90" text-anchor="middle">Hugo</text>

  <!-- arrows down -->
  <path class="d-line-accent" d="M105 122V150" marker-end="url(#un-arrow)" />
  <path class="d-line-accent" d="M510 104V150" marker-end="url(#un-arrow)" />
  <text class="d-code-small" x="16" y="144">emp.union(new_hires)</text>
  <text class="d-code-small" x="528" y="144">emp.unionByName(new_hires)</text>

  <!-- union result: by position -->
  <text class="d-title" x="16" y="172">Por posición: columna 2 bajo columna 2</text>
  <rect class="d-box" x="16" y="180" width="54" height="22" rx="3" />
  <rect class="d-box" x="70" y="180" width="62" height="22" rx="3" />
  <rect class="d-box" x="132" y="180" width="62" height="22" rx="3" />
  <text class="d-muted" x="43" y="195" text-anchor="middle">emp_id</text>
  <text class="d-muted" x="101" y="195" text-anchor="middle">name</text>
  <text class="d-muted" x="163" y="195" text-anchor="middle">dept_id</text>
  <rect class="d-box-success" x="16" y="202" width="54" height="20" />
  <rect class="d-box-success" x="70" y="202" width="62" height="20" />
  <rect class="d-box-success" x="132" y="202" width="62" height="20" />
  <text class="d-muted" x="43" y="216" text-anchor="middle">1 … 6</text>
  <text class="d-muted" x="101" y="216" text-anchor="middle">Ana … Jorge</text>
  <text class="d-muted" x="163" y="216" text-anchor="middle">d01 … d06</text>
  <rect class="d-box" x="16" y="222" width="54" height="20" />
  <rect class="d-box-accent" x="70" y="222" width="62" height="20" />
  <rect class="d-box-accent" x="132" y="222" width="62" height="20" />
  <text class="d-text" x="43" y="236" text-anchor="middle">7</text>
  <text class="d-text" x="101" y="236" text-anchor="middle">d02</text>
  <text class="d-text" x="163" y="236" text-anchor="middle">Elena</text>
  <rect class="d-box" x="16" y="242" width="54" height="20" />
  <rect class="d-box-accent" x="70" y="242" width="62" height="20" />
  <rect class="d-box-accent" x="132" y="242" width="62" height="20" />
  <text class="d-text" x="43" y="256" text-anchor="middle">8</text>
  <text class="d-text" x="101" y="256" text-anchor="middle">d04</text>
  <text class="d-text" x="163" y="256" text-anchor="middle">Hugo</text>
  <text class="d-accent-text" x="208" y="236">← nombres en dept_id,</text>
  <text class="d-accent-text" x="208" y="256">sin ningún error</text>

  <!-- unionByName result -->
  <text class="d-title" x="440" y="172">Por nombre: cada valor en su columna</text>
  <rect class="d-box" x="440" y="180" width="54" height="22" rx="3" />
  <rect class="d-box" x="494" y="180" width="62" height="22" rx="3" />
  <rect class="d-box" x="556" y="180" width="62" height="22" rx="3" />
  <text class="d-muted" x="467" y="195" text-anchor="middle">emp_id</text>
  <text class="d-muted" x="525" y="195" text-anchor="middle">name</text>
  <text class="d-muted" x="587" y="195" text-anchor="middle">dept_id</text>
  <rect class="d-box-success" x="440" y="202" width="54" height="20" />
  <rect class="d-box-success" x="494" y="202" width="62" height="20" />
  <rect class="d-box-success" x="556" y="202" width="62" height="20" />
  <text class="d-muted" x="467" y="216" text-anchor="middle">1 … 6</text>
  <text class="d-muted" x="525" y="216" text-anchor="middle">Ana … Jorge</text>
  <text class="d-muted" x="587" y="216" text-anchor="middle">d01 … d06</text>
  <rect class="d-box-success" x="440" y="222" width="54" height="20" />
  <rect class="d-box-success" x="494" y="222" width="62" height="20" />
  <rect class="d-box-success" x="556" y="222" width="62" height="20" />
  <text class="d-text" x="467" y="236" text-anchor="middle">7</text>
  <text class="d-text" x="525" y="236" text-anchor="middle">Elena</text>
  <text class="d-text" x="587" y="236" text-anchor="middle">d02</text>
  <rect class="d-box-success" x="440" y="242" width="54" height="20" />
  <rect class="d-box-success" x="494" y="242" width="62" height="20" />
  <rect class="d-box-success" x="556" y="242" width="62" height="20" />
  <text class="d-text" x="467" y="256" text-anchor="middle">8</text>
  <text class="d-text" x="525" y="256" text-anchor="middle">Hugo</text>
  <text class="d-text" x="587" y="256" text-anchor="middle">d04</text>
  <text class="d-muted" x="632" y="236">8 filas, bien</text>
  <text class="d-muted" x="632" y="256">colocadas</text>

  <text class="d-muted" x="16" y="288">Las dos devuelven 8 filas. Solo una de ellas es correcta, y Spark no avisa: name y dept_id son texto las dos.</text>
</svg>
