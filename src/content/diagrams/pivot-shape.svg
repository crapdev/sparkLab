  <text class="d-text" x="663" y="92" text-anchor="middle">125.21</text>
  <text class="d-text" x="729" y="92" text-anchor="middle">126.18</text>
  <text class="d-text" x="795" y="92" text-anchor="middle">129.20</text>

  <rect class="d-box" x="520" y="98" width="110" height="22" />
  <rect class="d-box-success" x="630" y="98" width="66" height="22" />
  <rect class="d-box-success" x="696" y="98" width="66" height="22" />
  <rect class="d-box-success" x="762" y="98" width="66" height="22" />
  <text class="d-text" x="575" y="114" text-anchor="middle">Breads</text>
  <text class="d-text" x="663" y="114" text-anchor="middle">145.52</text>
  <text class="d-text" x="729" y="114" text-anchor="middle">140.86</text>
  <text class="d-text" x="795" y="114" text-anchor="middle">133.76</text>

  <text class="d-muted" x="520" y="160">Una celda sin datos queda en NULL.</text>
  <text class="d-muted" x="520" y="180">Sin la lista de valores, Spark recorre los datos</text>
  <text class="d-muted" x="520" y="198">para descubrirlos y añade una columna "null".</text>

  <!-- Footer -->
  <rect class="d-box-info" x="16" y="226" width="828" height="32" rx="8" />
  <text class="d-text" x="32" y="247">En BigMart: 48 filas en formato largo (sin los nulos) → 16 filas × 3 columnas de tamaño en formato ancho.</text>
</svg>
