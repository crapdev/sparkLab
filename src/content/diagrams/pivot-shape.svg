  <text class="d-text" x="71" y="158" text-anchor="middle">Breads</text>
  <text class="d-text" x="166" y="158" text-anchor="middle">Small</text>
  <text class="d-text" x="241" y="158" text-anchor="middle">145.52</text>

  <rect class="d-box" x="16" y="164" width="110" height="22" />
