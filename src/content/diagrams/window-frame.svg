  <rect class="d-box-info" x="16" y="250" width="728" height="64" rx="8" />
  <text class="d-text" x="32" y="272">El marco (en verde) crece una fila cada vez: cada fila recibe la suma de su marco, y el resultado tiene 5 filas.</text>
  <text class="d-muted" x="32" y="292">rowsBetween(-2, 0): las dos anteriores y la actual (media móvil). rowsBetween(unboundedPreceding, unboundedFollowing): todas, 80.</text>
  <text class="d-muted" x="32" y="308">Sin marco y con orderBy: desde el principio hasta la fila actual y sus empates. Sin orderBy: el grupo entero.</text>
