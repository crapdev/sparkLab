<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0L10 5L0 10z" />
    </marker>
    <marker id="arch-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <!-- Your code -->
  <rect class="d-box" x="16" y="136" width="126" height="68" rx="8" />
  <text class="d-title" x="79" y="165" text-anchor="middle">Tu código</text>
  <text class="d-muted" x="79" y="185" text-anchor="middle">PySpark</text>
  <path class="d-line" d="M142 170H196" marker-end="url(#arch-arrow)" />

  <!-- Cluster manager -->
  <rect class="d-box-info" x="200" y="20" width="170" height="62" rx="8" />
  <text class="d-title" x="285" y="46" text-anchor="middle">Cluster manager</text>
  <text class="d-muted" x="285" y="66" text-anchor="middle">asigna los recursos</text>
  <path class="d-line-dashed" d="M285 124V88" marker-end="url(#arch-arrow)" />
  <text class="d-muted" x="293" y="110">pide recursos</text>

  <!-- Driver -->
  <rect class="d-box-accent" x="200" y="126" width="170" height="88" rx="8" />
  <text class="d-title" x="285" y="156" text-anchor="middle">Driver</text>
  <text class="d-muted" x="285" y="176" text-anchor="middle">planifica el trabajo</text>
  <text class="d-muted" x="285" y="194" text-anchor="middle">y reparte las tasks</text>

  <!-- Driver to executors -->
  <path class="d-line-accent" d="M370 150L472 66" marker-end="url(#arch-arrow-accent)" />
  <path class="d-line-accent" d="M370 170H472" marker-end="url(#arch-arrow-accent)" />
  <path class="d-line-accent" d="M370 190L472 274" marker-end="url(#arch-arrow-accent)" />
  <text class="d-accent-text" x="388" y="162">tasks</text>
  <text class="d-muted" x="388" y="188">y vuelven</text>
  <text class="d-muted" x="388" y="203">resultados</text>

  <!-- Workers -->
  <g>
    <rect class="d-box" x="476" y="20" width="228" height="92" rx="8" />
    <text class="d-muted" x="488" y="40">Worker 1</text>
    <rect class="d-box-success" x="488" y="50" width="204" height="50" rx="6" />
    <text class="d-text" x="500" y="80">Executor</text>
    <rect class="d-box-accent" x="582" y="64" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="616" y="64" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="650" y="64" width="28" height="22" rx="4" />
  </g>
  <g>
    <rect class="d-box" x="476" y="124" width="228" height="92" rx="8" />
    <text class="d-muted" x="488" y="144">Worker 2</text>
    <rect class="d-box-success" x="488" y="154" width="204" height="50" rx="6" />
    <text class="d-text" x="500" y="184">Executor</text>
    <rect class="d-box-accent" x="582" y="168" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="616" y="168" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="650" y="168" width="28" height="22" rx="4" />
  </g>
  <g>
    <rect class="d-box" x="476" y="228" width="228" height="92" rx="8" />
    <text class="d-muted" x="488" y="248">Worker 3</text>
    <rect class="d-box-success" x="488" y="258" width="204" height="50" rx="6" />
    <text class="d-text" x="500" y="288">Executor</text>
    <rect class="d-box-accent" x="582" y="272" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="616" y="272" width="28" height="22" rx="4" />
    <rect class="d-box-accent" x="650" y="272" width="28" height="22" rx="4" />
  </g>

  <text class="d-muted" x="16" y="322">Cada cuadro naranja es una task: un trozo de trabajo sobre una partición.</text>
</svg>
