<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <marker id="jst-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <!-- Job -->
  <rect class="d-box" x="16" y="16" width="688" height="232" rx="10" />
  <text class="d-title" x="32" y="42">Job</text>
  <text class="d-muted" x="66" y="42">lo dispara la acción: wide_df.collect()</text>

  <!-- Stage 1 -->
  <rect class="d-box-info" x="32" y="60" width="270" height="170" rx="8" />
  <text class="d-title" x="48" y="86">Stage 1</text>
  <text class="d-muted" x="48" y="106">lee y calcula is_even (narrow)</text>
  <g>
    <rect class="d-box-accent" x="48" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="75" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="112" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="139" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="176" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="203" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="240" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="267" y="151" text-anchor="middle">task</text>
  </g>
  <text class="d-muted" x="75" y="188" text-anchor="middle">part. 0</text>
  <text class="d-muted" x="139" y="188" text-anchor="middle">part. 1</text>
  <text class="d-muted" x="203" y="188" text-anchor="middle">part. 2</text>
  <text class="d-muted" x="267" y="188" text-anchor="middle">part. 3</text>
  <text class="d-muted" x="48" y="216">4 particiones → 4 tasks</text>

  <!-- Shuffle -->
  <path class="d-line-accent" d="M308 146H412" marker-end="url(#jst-arrow-accent)" />
  <text class="d-accent-text" x="360" y="134" text-anchor="middle">shuffle</text>
  <text class="d-muted" x="360" y="166" text-anchor="middle">groupBy mueve</text>
  <text class="d-muted" x="360" y="181" text-anchor="middle">filas entre</text>
  <text class="d-muted" x="360" y="196" text-anchor="middle">particiones</text>

  <!-- Stage 2 -->
  <rect class="d-box-info" x="418" y="60" width="270" height="170" rx="8" />
  <text class="d-title" x="434" y="86">Stage 2</text>
  <text class="d-muted" x="434" y="106">agrupa y cuenta (wide)</text>
  <g>
    <rect class="d-box-accent" x="434" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="461" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="498" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="525" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="562" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="589" y="151" text-anchor="middle">task</text>
    <rect class="d-box-accent" x="626" y="124" width="54" height="44" rx="6" />
    <text class="d-text" x="653" y="151" text-anchor="middle">task</text>
  </g>
  <text class="d-muted" x="434" y="216">4 particiones de shuffle → 4 tasks</text>

  <text class="d-muted" x="16" y="278">Medido en el laboratorio: 1 job, 2 stages y 8 tasks.</text>
